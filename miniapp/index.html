<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030914">

      <a id="n-community" data-testid="nav-community" href="#community"><span class="nav-ico" data-icon="community"></span><span data-i18n="nav_community">Сообщество</span></a>
      <a id="n-profile" data-testid="nav-profile" href="#profile"><span class="nav-ico" data-icon="profile"></span><span data-i18n="nav_profile">Профиль</span></a>
    </nav>
